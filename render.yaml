# One-click Render Blueprint. Secrets marked sync:false are entered in the Render dashboard.
services:
  - type: web
    name: kendra-care
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: SESSION_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
