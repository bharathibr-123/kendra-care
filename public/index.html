<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kendra — care that circles around them, decisions that stay with them</title>
    <meta name="description" content="Kendra is an elder-centred care circle: medication schedules, adherence tracking, escalating email reminders and appointments shared securely between an elder, caretakers and family." />
    <meta name="theme-color" content="#0f5e57" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/app.css" />
    <script type="module" src="/js/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>

    <header class="topbar" role="banner">
      <a class="brand" href="#/" aria-label="Kendra home">
        <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true" focusable="false">
          <circle cx="20" cy="20" r="17" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="8 5" />
          <circle cx="20" cy="20" r="7" fill="currentColor" />
        </svg>
        <span>Kendra</span>
      </a>
      <div class="topbar-tools" role="group" aria-label="Display settings">
        <button type="button" class="tool" id="text-smaller" aria-label="Make text smaller">A−</button>
        <button type="button" class="tool" id="text-larger" aria-label="Make text larger">A+</button>
        <button type="button" class="tool" id="contrast-toggle" aria-pressed="false">High contrast</button>
        <button type="button" class="tool hidden" id="sign-out">Sign out</button>
      </div>
    </header>

    <main id="main" tabindex="-1">
      <noscript><p class="panel">Kendra needs JavaScript enabled to run.</p></noscript>
      <div id="view" aria-busy="true"></div>
    </main>

    <div id="announcer" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>
    <div id="toasts" class="toasts" aria-live="assertive" aria-atomic="true"></div>

    <footer class="footer" role="contentinfo">
      <p>Kendra supports care and never replaces a doctor's advice. In an emergency call <strong>112</strong>.</p>
    </footer>
  </body>
</html>
